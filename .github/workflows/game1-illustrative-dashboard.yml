name: Game 1 illustrative dashboard data

on:
  pull_request:
    paths:
      - "src/interfirm_abm/task_*.py"
      - "tests/test_task_*.py"
      - ".github/workflows/game1-illustrative-dashboard.yml"
  workflow_dispatch:

jobs:
  export-illustrative-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Verify reproducible export
        run: python -m pytest -q tests/test_task_economic_export.py
      - name: Export 200-round illustrative JSON
        run: python -m interfirm_abm.task_illustrative_export site/economic-results.json --rounds 200
      - name: Check exported data and disclosure
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path("site/economic-results.json").read_text())
          assert p["rounds"] == 200 and p["players"] == 2
          assert "ILLUSTRATIVE FIXTURE ONLY" in p["warning"]
          assert len(p["configurations"][0]["player_trajectory"]) == 400
          print("Illustrative data verified; not research validated")
          PY
      - name: Upload dashboard JSON for review (not Pages publication)
        uses: actions/upload-artifact@v4
        with:
          name: game1-illustrative-economic-results
          path: site/economic-results.json
          if-no-files-found: error
