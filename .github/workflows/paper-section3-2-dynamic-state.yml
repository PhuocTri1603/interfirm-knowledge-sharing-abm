name: Section 3.2 dynamic SLSQP state and runtime comparison
on:
  push:
    branches: [game1-economic-policy-interface]
    paths:
      - '.github/workflows/paper-section3-2-dynamic-state.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: section32-dynamic-state
  cancel-in-progress: true
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: one-thread
            threads: '1'
          - label: two-thread-a
            threads: '2'
          - label: two-thread-b
            threads: '2'
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: ${{ matrix.threads }}
      OMP_NUM_THREADS: ${{ matrix.threads }}
      MKL_NUM_THREADS: ${{ matrix.threads }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: game1-economic-policy-interface
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install immutable original engine and record numerical runtime
        run: |
          git worktree add --detach /tmp/game1-original c614b86d9192a57fb402b4772b3c3bb6bf80b79f
          python -m pip install -e '/tmp/game1-original[dev]'
          mkdir -p /tmp/original /tmp/trace
          python -m pip freeze > /tmp/trace/environment.txt
          python -c 'import numpy,scipy,platform,json; numpy.show_runtime(); numpy.show_config(); print(platform.platform())' > /tmp/trace/numerical_runtime.txt
          env | grep -E '^(OPENBLAS|OMP|MKL)_' > /tmp/trace/thread_settings.txt
          python -m pip check > /tmp/trace/pip_check.txt
      - name: Download immutable archived observations
        run: gh run download 42463803820 -R "${{ github.repository }}" -n game1-full-sample-analysis -D /tmp/original
      - name: Capture F011 dynamic state and optimizer inputs
        run: PYTHONPATH=/tmp/game1-original/src python scripts/trace_paper_section3_2_first_divergence.py --archive /tmp/original --out /tmp/trace --profile F011 --sigma 0.5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: section32-dynamic-${{ matrix.label }}
          path: /tmp/trace/
          if-no-files-found: error
  compare:
    needs: probe
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: game1-economic-policy-interface
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pandas==2.3.3
      - uses: actions/download-artifact@v4
        with:
          pattern: section32-dynamic-*
          path: /tmp/traces
      - name: Compare numerical traces
        run: python scripts/compare_paper_section3_2_solver_traces.py --traces /tmp/traces --out /tmp/compare
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: section32-dynamic-comparison
          path: /tmp/compare/
          if-no-files-found: warn
