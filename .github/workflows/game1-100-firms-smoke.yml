name: Game 1 100-firm smoke checks

on:
  push:
    branches:
      - experiment/game1-100-firms
    paths:
      - ".github/workflows/game1-100-firms-smoke.yml"
      - "experiments/validation_05.py"
      - "experiments/game1_mechanism_trajectories.py"
      - "tests/**"
      - "src/interfirm_abm/**"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Run unit tests
        run: python -m pytest -q
      - name: Run 100-firm one-seed matched validation
        run: python -m experiments.validation_05 --firms 100 --seeds 1 --export-dir results/game1_100_smoke
      - name: Validate 100-firm export
        run: |
          python - <<'PY'
          import json
          import pandas as pd
          from pathlib import Path
          p = Path("results/game1_100_smoke")
          d = pd.read_csv(p / "paired_observations.csv")
          m = json.loads((p / "metadata.json").read_text())
          assert len(d) == m["expected_paired_rows"] == 400
          assert d["firm_id"].nunique() == 100
          assert d.groupby("technology")["firm_id"].nunique().eq(25).all()
          assert not d.isna().any().any()
          print("100-firm smoke validation passed")
          PY
      - name: Export full one-seed firm-round trajectories
        run: python -m experiments.game1_mechanism_trajectories --firms 100 --seeds 1 --export-dir results/game1_100_trajectories
      - name: Verify trajectory counts
        run: |
          python - <<'PY'
          import pandas as pd
          from pathlib import Path
          p = Path("results/game1_100_trajectories")
          assert len(pd.read_csv(p / "firm_round_trajectories.csv")) == 10000
          assert len(pd.read_csv(p / "paired_firm_round.csv")) == 5000
          print("100-firm trajectory checks passed")
          PY
      - name: Record provenance
        run: |
          printf '%s\n' "$GITHUB_SHA" > results/game1_100_smoke/source_commit.txt
          python -m pip freeze > results/game1_100_smoke/environment.txt
      - name: Upload private smoke artifacts
        uses: actions/upload-artifact@v4
        with:
          name: game1-100-firm-smoke-${{ github.sha }}
          path: |
            results/game1_100_smoke/
            results/game1_100_trajectories/
          retention-days: 90
          if-no-files-found: error
