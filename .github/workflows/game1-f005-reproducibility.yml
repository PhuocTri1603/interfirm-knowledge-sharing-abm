name: F005 seed47 reproducibility check

on:
  push:
    branches: [game1-economic-policy-interface]
    paths:
      - '.github/workflows/game1-f005-reproducibility.yml'
  workflow_dispatch:

jobs:
  repeated-seed47:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Record numerical environment
        run: |
          python -c "import sys,numpy,scipy;print('Python',sys.version);print('NumPy',numpy.__version__);print('SciPy',scipy.__version__);numpy.show_config()"
      - name: First independent simulation
        run: |
          python scripts/audit_game1_f005_solver_focus.py --sigma 2.0 --seed 47 --fee-multiplier 1 --rounds 200
          mkdir -p results/repro/a
          cp results/game1_f005_solver_focus/*rounds.csv results/repro/a/
      - name: Second independent simulation
        run: |
          python scripts/audit_game1_f005_solver_focus.py --sigma 2.0 --seed 47 --fee-multiplier 1 --rounds 200
          mkdir -p results/repro/b
          cp results/game1_f005_solver_focus/*rounds.csv results/repro/b/
      - name: Compare all 1800 player-round records and actions
        run: |
          python - <<'PY'
          import csv,glob,hashlib
          a=glob.glob('results/repro/a/*.csv')[0]
          b=glob.glob('results/repro/b/*.csv')[0]
          with open(a,newline='') as f: rows_a=list(csv.DictReader(f))
          with open(b,newline='') as f: rows_b=list(csv.DictReader(f))
          assert len(rows_a)==len(rows_b)==1800
          action_diff=[(x['round'],x['strategy_id'],x['action'],y['action'])
                       for x,y in zip(rows_a,rows_b) if x['action']!=y['action']]
          numeric_diff=[(x['round'],x['strategy_id'])
                        for x,y in zip(rows_a,rows_b) if x!=y]
          print('action_differences:',len(action_diff),action_diff[:20])
          print('record_differences:',len(numeric_diff),numeric_diff[:20])
          for p in (a,b):
              with open(p,'rb') as f:print(p,hashlib.sha256(f.read()).hexdigest())
          if action_diff or numeric_diff:
              raise AssertionError('Identical inputs and pinned numerical threads produced different output')
          print('PASS: exact 200-round, 9-strategy reproducibility in controlled environment')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f005-seed47-repeat-outputs
          path: results/repro/**/*.csv
