name: Publish illustrative Game 1 Pages demo

# Explicit opt-in: never publish a research fixture on a pull-request run.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: game1-illustrative-pages
  cancel-in-progress: false

jobs:
  publish-demo:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Verify illustrative export and dashboard
        run: python -m pytest -q tests/test_task_economic_export.py tests/test_task_site_economic_mode.py
      - name: Generate reproducible 200-round demo data
        run: python -m interfirm_abm.task_illustrative_export site/economic-results.json --rounds 200
      - name: Verify explicit research warning
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("site/economic-results.json").read_text(encoding="utf-8"))
          assert payload["rounds"] == 200 and payload["players"] == 2
          assert "ILLUSTRATIVE FIXTURE ONLY" in payload["warning"]
          assert "not research-validated" in Path("site/index.html").read_text(encoding="utf-8")
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
