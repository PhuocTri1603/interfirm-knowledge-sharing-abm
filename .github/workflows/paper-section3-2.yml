name: Paper Section 3.2 archived mechanism evidence
on:
  workflow_dispatch:
  push:
    branches: [game1-economic-policy-interface]
    paths:
      - 'scripts/analyze_paper_section3_2.py'
      - 'tests/test_paper_section3_2.py'
      - '.github/workflows/paper-section3-2.yml'
permissions:
  contents: write
jobs:
  archived-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
        with:
          ref: game1-economic-policy-interface
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy==2.4.6' 'pandas==2.3.3' 'matplotlib==3.10.8' pytest
      - name: Download exact original full-sample round data
        run: |
          mkdir -p /tmp/original_nine_policy
          gh run download 42463803820 -R "${{ github.repository }}" -n game1-full-sample-analysis -D /tmp/original_nine_policy
          test "$(find /tmp/original_nine_policy -name 'sigma_*_batch_*_rounds.csv' | wc -l)" -eq 30
      - name: Audit and render Section 3.2 evidence without rerunning simulation
        run: python scripts/analyze_paper_section3_2.py --input /tmp/original_nine_policy --out results/paper/section3
      - name: Validate Section 3.2 tests
        run: python -m pytest -q tests/test_paper_section3_2.py
      - name: Upload immutable evidence bundle
        uses: actions/upload-artifact@v4
        with:
          name: paper-section3-2-evidence
          path: |
            results/paper/section3/section3_2_*
            results/paper/section3/figure_3_4_*
            results/paper/section3/figure_3_5_*
            results/paper/section3/figure_3_6_*
          if-no-files-found: error
      - name: Commit audited outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f results/paper/section3/section3_2_* results/paper/section3/figure_3_4_* results/paper/section3/figure_3_5_* results/paper/section3/figure_3_6_*
          if ! git diff --cached --quiet; then
            git commit -m "Publish Section 3.2 archived evidence and documented gaps"
            git push origin HEAD:game1-economic-policy-interface
          fi
