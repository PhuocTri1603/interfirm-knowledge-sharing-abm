name: Heterogeneous Game 1 horizons
on:
  push:
    branches:
      - experiment/game1-heterogeneous-firms
    paths:
      - ".github/workflows/game1-heterogeneous-horizons.yml"
      - "experiments/game1_heterogeneous.py"
  workflow_dispatch:
jobs:
  horizons:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        rounds: [50, 100, 200]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - name: Run paired heterogeneous experiment
        run: python -m experiments.game1_heterogeneous --rounds ${{ matrix.rounds }} --seeds 100 --population-seed 2026 --export-dir results/heterogeneous_${{ matrix.rounds }}
      - name: Analyze heterogeneity by technology and alpha strata
        run: python -m experiments.analyze_game1_heterogeneous --input results/heterogeneous_${{ matrix.rounds }}/paired_firm_outcomes.csv --output results/heterogeneous_${{ matrix.rounds }}/subgroup_summary.json
      - name: Verify exports
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          for p in Path("results").glob("heterogeneous_*"):
              a=pd.read_csv(p/"final_firm_outcomes.csv")
              b=pd.read_csv(p/"paired_firm_outcomes.csv")
              s=json.loads((p/"summary.json").read_text())
              assert len(a)==20000 and len(b)==10000
              assert s["learning_seeds"]==100
              assert a.groupby(["seed","policy"])["firm_id"].nunique().eq(100).all()
              assert a.groupby(["seed","policy"])["technology"].nunique().eq(4).all()
              assert a.groupby(["seed","policy","technology"])["firm_id"].nunique().eq(25).all()
          PY
      - run: |
          printf '%s\n' "$GITHUB_SHA" > results/heterogeneous_${{ matrix.rounds }}/source_commit.txt
          python -m pip freeze > results/heterogeneous_${{ matrix.rounds }}/environment.txt
      - uses: actions/upload-artifact@v4
        with:
          name: heterogeneous-game1-${{ matrix.rounds }}-${{ github.sha }}
          path: results/heterogeneous_${{ matrix.rounds }}/
          retention-days: 90
