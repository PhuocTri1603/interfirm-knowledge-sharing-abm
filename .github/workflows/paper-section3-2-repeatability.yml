name: Section 3.2 repeatability gate and representative profiles
on:
  push:
    branches: [game1-economic-policy-interface]
    paths:
      - '.github/workflows/paper-section3-2-repeatability.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: section32-repeatability
  cancel-in-progress: true
jobs:
  repeat-f011:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        repeat: [1,2,3]
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: game1-economic-policy-interface
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install historical unchanged engine
        run: |
          git worktree add --detach /tmp/game1-original c614b86d9192a57fb402b4772b3c3bb6bf80b79f
          python -m pip install -e '/tmp/game1-original[dev]'
          mkdir -p /tmp/original /tmp/trace
          python -m pip freeze > /tmp/trace/environment.txt
          python -c 'import numpy; numpy.show_runtime()' > /tmp/trace/numerical_runtime.txt
      - name: Download original archive
        run: gh run download 42463803820 -R "${{ github.repository }}" -n game1-full-sample-analysis -D /tmp/original
      - name: Trace F011 and capture first optimizer inputs
        run: PYTHONPATH=/tmp/game1-original/src python scripts/trace_paper_section3_2_first_divergence.py --archive /tmp/original --out /tmp/trace --profile F011 --sigma 0.5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: section32-repeat-F011-${{ matrix.repeat }}
          path: /tmp/trace/
          if-no-files-found: error
  gate:
    needs: repeat-f011
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: game1-economic-policy-interface
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: section32-repeat-F011-*
          path: /tmp/repeats
      - name: Check all three against archive and static solver inputs
        run: python scripts/gate_paper_section3_2_repeatability.py /tmp/repeats /tmp/gate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: section32-repeatability-gate
          path: /tmp/gate/
          if-no-files-found: warn
  representative:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        profile: [F021,F071,F091]
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: game1-economic-policy-interface
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install unchanged historical engine
        run: |
          git worktree add --detach /tmp/game1-original c614b86d9192a57fb402b4772b3c3bb6bf80b79f
          python -m pip install -e '/tmp/game1-original[dev]'
          mkdir -p /tmp/original /tmp/trace
      - name: Download archived baseline
        run: gh run download 42463803820 -R "${{ github.repository }}" -n game1-full-sample-analysis -D /tmp/original
      - name: Representative profile trace
        run: PYTHONPATH=/tmp/game1-original/src python scripts/trace_paper_section3_2_first_divergence.py --archive /tmp/original --out /tmp/trace --profile ${{ matrix.profile }} --sigma 0.5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: section32-representative-${{ matrix.profile }}
          path: /tmp/trace/
          if-no-files-found: warn
