name: Game 2 mechanism diagnostics
on:
  push:
    branches:
      - experiment/game1-heterogeneous-firms
    paths:
      - 'experiments/diagnose_game2_mechanisms.py'
      - 'tests/test_game2_mechanism_diagnostics.py'
      - '.github/workflows/game2-mechanism-diagnostics.yml'
  workflow_dispatch:
jobs:
  mechanism:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        population_seed: [2026, 2027, 2028, 2029, 2030]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q tests/test_game2_mechanism_diagnostics.py
      - name: Run Game 2 mechanism diagnostics
        run: python experiments/diagnose_game2_mechanisms.py --rounds 100 --seeds 20 --population-seed ${{ matrix.population_seed }} --export-dir results/game2-mechanisms-${{ matrix.population_seed }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: game2-mechanisms-${{ matrix.population_seed }}-${{ github.run_id }}
          path: results/game2-mechanisms-${{ matrix.population_seed }}/
