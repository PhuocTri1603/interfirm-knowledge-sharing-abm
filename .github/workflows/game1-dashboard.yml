name: Game 1 dashboard publication

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "src/interfirm_abm/task_dashboard_export.py"
      - "src/interfirm_abm/task_shared_market_game.py"
      - "src/interfirm_abm/task_layer_registry.py"
      - ".github/workflows/game1-dashboard.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: game1-dashboard-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install simulation
        run: python -m pip install -e .
      - name: Generate 200-round market chart dataset
        run: python -m interfirm_abm.task_dashboard_export --output site/data.json --configurations 3
      - name: Verify dashboard files
        run: |
          test -s site/index.html
          test -s site/data.json
          python -c 'import json; d=json.load(open("site/data.json")); assert d["players"]==3072 and d["rounds"]==200 and len(d["configurations"])==3'
      - name: Checkout unmerged diagnostic branch separately
        uses: actions/checkout@v4
        with:
          ref: game1-economic-policy-interface
          path: diagnostic-source
      - name: Generate explicitly unvalidated Game 1 preview
        run: |
          python -m pip install -e "./diagnostic-source"
          cd diagnostic-source
          python - <<'PY'
          import sys
          sys.path.insert(0, "tests")
          from test_task_full_tournament import configurations, market_factory, policy_factory
          from interfirm_abm.task_full_tournament import TournamentSpecification, run_full_tournament
          from interfirm_abm.task_tournament_dashboard import write_tournament_dashboard
          from interfirm_abm.task_tournament_export import export_tournament
          from interfirm_abm.task_strategy_audit import audit_strategy_semantics
          from pathlib import Path
          import json
          result = run_full_tournament(
              configurations(1),
              TournamentSpecification(market_factory, policy_factory, rounds=200, expected_configurations=1),
          )
          target = Path("../site/game1-diagnostic")
          target.mkdir(parents=True, exist_ok=True)
          write_tournament_dashboard(result, target / "economic-results.json")
          export_tournament(result, target / "tables")
          (target / "strategy-audit.json").write_text(json.dumps(audit_strategy_semantics(), indent=2))
          (target / "index.html").write_text(Path("site/index.html").read_text())
          payload = json.loads((target / "economic-results.json").read_text())
          assert payload["players"] == 256 and payload["rounds"] == 200
          assert len(payload["configurations"][0]["player_trajectory"]) == 51200
          assert payload["preview_only"] is False
          assert "ILLUSTRATIVE" in payload["warning"]
          print("Game 1 diagnostic preview ready, separate from the existing public dashboard")
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
