name: Heterogeneous Game 1 tests
on:
  push:
    branches:
      - experiment/game1-heterogeneous-firms
  workflow_dispatch:
jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
