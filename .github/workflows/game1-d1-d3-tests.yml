name: Game 1 D1-D3 regression tests
on:
  push:
    branches:
      - game1-economic-policy-interface
    paths:
      - 'src/**'
      - 'tests/**'
      - 'data/firms/**'
      - 'pyproject.toml'
      - '.github/workflows/game1-d1-d3-tests.yml'
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run existing and D1-D3 regression tests (no Game 1 simulation)
        run: python -m pytest tests/ -q --tb=short
