name: Game 1 D1-D3 regression tests
on:
  push:
    branches:
      - game1-economic-policy-interface
    paths:
      - 'src/**'
      - 'tests/**'
      - 'data/firms/**'
      - 'pyproject.toml'
      - '.github/workflows/game1-d1-d3-tests.yml'
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run A6 and D1-D3 focused regression gate
        run: python -m pytest tests/test_game1_d1_d2.py tests/test_game1_d3.py tests/test_game1_l5_l6_mechanisms.py tests/test_task_a6_market.py tests/test_task_l34_economics.py -q --tb=short
      - name: Run entire legacy regression suite (diagnostic; must report failures)
        if: always()
        continue-on-error: true
        run: python -m pytest tests/ -q --tb=short

# CI trigger: approved D3 regression and legacy compatibility gate.
