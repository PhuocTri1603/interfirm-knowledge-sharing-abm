name: Game 1 task-based validation

on:
  push:
    branches: [main]
    paths:
      - "src/interfirm_abm/task_*.py"
      - "tests/test_task_*.py"
      - "data/firms/task_based_100_firms_*.csv"
      - ".github/workflows/game1-task-validation.yml"
  pull_request:
    paths:
      - "src/interfirm_abm/task_*.py"
      - "tests/test_task_*.py"
      - "data/firms/task_based_100_firms_*.csv"
      - ".github/workflows/game1-task-validation.yml"
  workflow_dispatch:

jobs:
  task-validation:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run Game 1 task-based unit and integration tests
        run: |
          python -m pytest -q \
            tests/test_task_based_firm.py \
            tests/test_task_economics.py \
            tests/test_task_aggregators.py \
            tests/test_task_execution.py \
            tests/test_task_bundle.py \
            tests/test_task_plan_selection.py \
            tests/test_task_candidate_generation.py \
            tests/test_task_pipeline.py \
            tests/test_task_population_smoke.py \
            tests/test_task_population_pipeline.py \
            tests/test_task_strategy_population.py \
            tests/test_task_shared_market.py \
            tests/test_task_repeated_market.py \
            tests/test_task_strategy_policy.py \
            tests/test_task_policy_adapter.py \
            tests/test_task_layer_registry.py \
            tests/test_task_experiment_registry.py \
            tests/test_task_experiment_config.py \
            tests/test_task_experiment_pipeline.py \
            tests/test_task_economic_audit.py \
            tests/test_task_technology_review.py \
            tests/test_task_ar_benchmark.py \
            tests/test_task_shared_market_game.py \
            tests/test_task_economic_policy.py \
            tests/test_task_economic_tournament.py \
            tests/test_task_economic_dashboard.py \
            tests/test_task_policy_binding.py \
            tests/test_task_registered_tournament.py \
            tests/test_task_market_bridge.py \
            tests/test_task_dynamic_market.py \
            tests/test_task_site_economic_mode.py \
            tests/test_task_economic_export.py \
            tests/test_task_decision_rules.py \
            tests/test_task_learning_choices.py \
            tests/test_task_market_beliefs.py \
            tests/test_task_adaptive_beliefs.py \
            tests/test_task_adaptive_policies.py \
            tests/test_task_adaptive_market_integration.py \
            tests/test_task_strategy_market.py \
            tests/test_task_strategy_tournament.py \
            tests/test_task_dashboard_validation.py \
            tests/test_task_experiment_dimensions.py \
            tests/test_task_initial_profile_bridge.py \
            tests/test_task_experiment_manifest.py \
            tests/test_task_profile_strategy_roster.py \
            tests/test_task_mixed_benchmark.py
