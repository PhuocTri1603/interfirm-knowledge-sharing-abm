name: Game 1 behavioral mechanisms experiment

on:
  pull_request:
    paths:
      - "src/interfirm_abm/task_behavioral_experiment.py"
      - "src/interfirm_abm/task_dynamic_market.py"
      - "tests/test_task_dynamic_market.py"
      - ".github/workflows/game1-behavioral-experiment.yml"
  workflow_dispatch:

jobs:
  behavioral-comparison:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Verify behavioral mechanism tests
        run: python -m pytest -q tests/test_task_dynamic_market.py
      - name: Run 200-round mechanism comparison
        run: python -m interfirm_abm.task_behavioral_experiment results/game1-behavioral-comparison.json --rounds 200 --seed 17 --epsilon 0.1
      - name: Validate comparison metadata
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path("results/game1-behavioral-comparison.json").read_text())
          assert p["experiment_status"] == "controlled_unvalidated_behavioral_comparison"
          assert len(p["player_trajectory"]) == 400
          assert len(p["ranking"]) == 2
          assert sum(p["learning_action_counts"].values()) == 200
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: game1-behavioral-mechanisms-200-rounds
          path: results/game1-behavioral-comparison.json
          if-no-files-found: error
