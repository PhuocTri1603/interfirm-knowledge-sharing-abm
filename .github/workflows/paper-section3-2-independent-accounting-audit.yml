name: Section 3.2 full archive independent accounting audit
on:
  workflow_dispatch:
  push:
    branches: [game1-economic-policy-interface]
    paths: ['.github/workflows/paper-section3-2-independent-accounting-audit.yml']
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve frozen original archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/${{ github.repository }}/actions/artifacts/13618500797/zip > /tmp/archive.zip
      - name: Independently verify market identities for all 540000 observations
        run: python scripts/audit_section3_2_full_archive_market_identities.py --archive /tmp/archive.zip --out /tmp/report/identities
      - name: Independently recalculate full 100-profile counterfactual and rankings
        run: python scripts/check_paper_section3_2_full100_counterfactual.py --archive /tmp/archive.zip --out /tmp/report/counterfactual
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: section3-2-independent-full-archive-audit
          path: /tmp/report
