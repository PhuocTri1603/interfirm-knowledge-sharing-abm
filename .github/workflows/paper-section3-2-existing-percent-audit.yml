name: Section 3.2 existing full100 percentage-error audit
on:
  workflow_dispatch:
  push:
    branches: [game1-economic-policy-interface]
    paths: ['.github/workflows/paper-section3-2-existing-percent-audit.yml']
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          run-id: 43526795473
          github-token: ${{ github.token }}
          pattern: historical-strict-batch-*
          path: /tmp/replays
      - name: Download historical archive without running any simulation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/historical
          gh api repos/${{ github.repository }}/actions/artifacts/13618500797/zip > /tmp/historical.zip
          unzip -q /tmp/historical.zip -d /tmp/historical
      - name: Calculate both percentage errors, actions and full terminal rankings
        run: |
          python scripts/analyze_section3_2_full100_existing_percent_errors.py --replays /tmp/replays --archive /tmp/historical --out /tmp/report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: section3-2-full100-existing-percent-errors
          path: /tmp/report
