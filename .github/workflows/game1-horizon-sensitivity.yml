name: Game 1 horizon sensitivity (100 firms)

on:
  push:
    branches:
      - experiment/game1-100-firms
    paths:
      - ".github/workflows/game1-horizon-sensitivity.yml"
      - "experiments/game1_mechanism_trajectories.py"
  workflow_dispatch:

jobs:
  horizons:
    strategy:
      fail-fast: false
      matrix:
        rounds: [50, 100, 200]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install research package
        run: python -m pip install -e ".[dev]"
      - name: Run automated tests
        run: python -m pytest -q
      - name: Run full firm-round experiment
        run: python -m experiments.game1_mechanism_trajectories --firms 100 --seeds 100 --rounds ${{ matrix.rounds }} --export-dir results/horizon_${{ matrix.rounds }}
      - name: Verify counts and balance
        run: |
          python - <<'PY'
          import json
          import pandas as pd
          from pathlib import Path
          rounds = ${{ matrix.rounds }}
          folder = Path(f"results/horizon_{rounds}")
          m = json.loads((folder / "metadata.json").read_text())
          d = pd.read_csv(folder / "firm_round_trajectories.csv")
          p = pd.read_csv(folder / "paired_firm_round.csv")
          assert len(d) == m["expected_history_rows"] == 100 * 100 * rounds * 2
          assert len(p) == m["expected_paired_rows"] == 100 * 100 * rounds
          assert d["firm_id"].nunique() == 100
          assert d["seed"].nunique() == 100
          assert d["round"].nunique() == rounds
          assert d.groupby("technology")["firm_id"].nunique().eq(25).all()
          assert not d.isna().any().any()
          assert not p.isna().any().any()
          print("Verified horizon", rounds, "with", len(d), "firm-round rows")
          PY
      - name: Record provenance
        run: |
          printf '%s\n' "$GITHUB_SHA" > results/horizon_${{ matrix.rounds }}/source_commit.txt
          python -m pip freeze > results/horizon_${{ matrix.rounds }}/environment.txt
      - name: Upload private results
        uses: actions/upload-artifact@v4
        with:
          name: game1-horizon-${{ matrix.rounds }}-${{ github.sha }}
          path: results/horizon_${{ matrix.rounds }}/
          if-no-files-found: error
          retention-days: 90
