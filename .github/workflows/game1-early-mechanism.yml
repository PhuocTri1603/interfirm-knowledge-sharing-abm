name: Game 1 early search mechanism accounting
on:
  workflow_dispatch:
jobs:
  mechanism-accounting:
    strategy:
      fail-fast: false
      matrix:
        population_seed: [2026, 2027, 2028, 2029, 2030]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/game1-heterogeneous-firms
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[dev]"
      - name: Check unchanged simulation contract
        run: python -m pytest -q
      - name: Diagnose observed search and acceptance histories
        run: python -m experiments.diagnose_game1_early_mechanism --population-seed ${{ matrix.population_seed }} --learning-seeds 100 --output results/early-mechanism-${{ matrix.population_seed }}.json
      - name: Record checked-out source
        run: git rev-parse HEAD > results/source-commit-${{ matrix.population_seed }}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: game1-early-mechanism-${{ matrix.population_seed }}-${{ github.run_id }}
          path: |
            results/early-mechanism-${{ matrix.population_seed }}.json
            results/source-commit-${{ matrix.population_seed }}.txt
          retention-days: 90
