name: Game 1 trajectory phase robustness (100 seeds)
on:
  workflow_dispatch:
jobs:
  phase-diagnostic:
    strategy:
      fail-fast: false
      matrix:
        population_seed: [2026, 2027, 2028, 2029, 2030]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/game1-heterogeneous-firms
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - name: Analyze paired efficiency by learning phase
        run: python -m experiments.diagnose_game1_trajectory_phases --population-seed ${{ matrix.population_seed }} --learning-seeds 100 --output results/phase-${{ matrix.population_seed }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: game1-phase-${{ matrix.population_seed }}-${{ github.run_id }}
          path: results/phase-${{ matrix.population_seed }}.json
          retention-days: 90
