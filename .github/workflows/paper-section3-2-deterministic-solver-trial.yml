name: Section 3.2 single-thread 200-round reproducibility gate
on:
  workflow_dispatch:
  push:
    branches: [game1-economic-policy-interface]
    paths: ['.github/workflows/paper-section3-2-deterministic-solver-trial.yml']
permissions:
  contents: read
jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - {label: one-a}
          - {label: one-b}
          - {label: one-c}
          - {label: one-d}
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      BLIS_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: game1-economic-policy-interface
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install immutable original engine
        run: |
          git worktree add --detach /tmp/game1-original c614b86d9192a57fb402b4772b3c3bb6bf80b79f
          python -m pip install -e '/tmp/game1-original[dev]'
          python -m pip install --force-reinstall 'numpy==2.4.6' 'scipy==1.17.1' 'pandas==2.3.3'
          python -m pip freeze > /tmp/pip-freeze.txt
          python -c 'import numpy; numpy.show_runtime()' > /tmp/numerical-runtime.txt
      - name: Test numerical solver only on F011 sigma 0.5
        run: |
          PYTHONPATH=/tmp/game1-original/src python scripts/trial_paper_section3_2_deterministic_solver.py --rounds 200 --out /tmp/trial
          cp /tmp/pip-freeze.txt /tmp/numerical-runtime.txt /tmp/trial/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deterministic-solver-${{ matrix.label }}
          path: /tmp/trial
  compare:
    needs: trial
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: deterministic-solver-*
          path: /tmp/trials
      - name: Strict bitwise comparison across four independent single-thread 200-round runners
        run: |
          python - <<'PY'
          import json,pathlib,sys
          files=sorted(pathlib.Path("/tmp/trials").rglob("deterministic_solver_trial.json"))
          if len(files)!=4:
              print("INCOMPLETE",len(files));sys.exit(2)
          data=[json.loads(p.read_text()) for p in files]
          for p,d in zip(files,data):
              print("TRIAL",p.parent.name,d["digest"],"calls",d["solver_calls"])
          identical=len({d["digest"] for d in data})==1 and all(d["rounds"]==200 and len(d["rows"])==1800 and len(d["markets"])==200 for d in data)
          print("BITWISE_REPRODUCIBLE",identical)
          if not identical:
              base=data[0]["rows"]
              for p,d in zip(files[1:],data[1:]):
                  mismatch=next((i for i,(a,b) in enumerate(zip(base,d["rows"])) if a!=b),None)
                  print("FIRST_MISMATCH",p.parent.name,mismatch)
          sys.exit(0 if identical else 3)
          PY
