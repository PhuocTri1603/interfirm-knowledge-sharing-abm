name: Publish Game 1 replay to GitHub Pages
on:
  push:
    branches: [experiment/game1-100-firms]
    paths:
      - web/**
      - tools/build_replay_data.py
      - tools/check_replay_sample.py
      - tools/replay_statistics.py
      - tests/test_replay_statistics.py
      - tests/test_*view.cjs
      - tests/test_replay_selection.cjs
      - tests/test_replay_data.py
      - .github/workflows/game1-pages.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: game1-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test replay data contract and statistics
        run: |
          python -m unittest discover -s tests -p 'test_replay*.py' -v
          node tests/test_production_view.cjs
          node tests/test_replay_selection.cjs
      - name: Download immutable verified artifact
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            for (const [horizon, artifactId] of [[50,13031790079],[100,13031585631],[200,13030944570]]) {
            const artifact = await github.rest.actions.getArtifact({
              owner: context.repo.owner, repo: context.repo.repo, artifact_id: artifactId
            });
            if (artifact.data.expired || artifact.data.workflow_run.head_sha !== '40266bf38b644bb169fcb5d1358f9649ab7085cb') {
              throw new Error('Verified artifact is expired or has unexpected provenance');
            }
            const zip = await github.rest.actions.downloadArtifact({
              owner: context.repo.owner, repo: context.repo.repo,
              artifact_id: artifactId, archive_format: 'zip'
            });
            fs.writeFileSync('verified-horizon'+horizon+'.zip', Buffer.from(zip.data));
            }
      - name: Build and independently sample-check all original horizons
        run: |
          for horizon in 50 100 200; do
            python tools/build_replay_data.py verified-horizon${horizon}.zip --horizon $horizon --output web/data/$horizon --packed
            python tools/check_replay_sample.py verified-horizon${horizon}.zip --data web/data/$horizon
          done
      - name: Stage public website only and enforce size budget
        run: |
          python - <<'PY'
          import shutil
          from pathlib import Path
          destination = Path('pages-dist')
          destination.mkdir()
          shutil.copyfile('web/index.html', destination / 'index.html')
          shutil.copytree('web/data', destination / 'data')
          (destination / '.nojekyll').touch()
          size = sum(p.stat().st_size for p in destination.rglob('*') if p.is_file())
          assert size < 900_000_000, f'Website too large: {size} bytes'
          print(f'Public website size: {size:,} bytes; no research source or ZIP staged')
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy authorized public replay
        id: deployment
        uses: actions/deploy-pages@v4

