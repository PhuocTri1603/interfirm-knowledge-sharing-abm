name: Section 3.2 SLSQP call-two Jacobian conditioning and evaluation forensics
on:
  push:
    branches: [game1-economic-policy-interface]
    paths:
      - '.github/workflows/paper-section3-2-call2-forensics.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {label: one-a, threads: '1'}
          - {label: one-b, threads: '1'}
          - {label: two-a, threads: '2'}
          - {label: two-b, threads: '2'}
    env:
      OPENBLAS_NUM_THREADS: ${{ matrix.threads }}
      OMP_NUM_THREADS: ${{ matrix.threads }}
      MKL_NUM_THREADS: ${{ matrix.threads }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: game1-economic-policy-interface
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original engine and record numerical environment
        run: |
          git worktree add --detach /tmp/game1-original c614b86d9192a57fb402b4772b3c3bb6bf80b79f
          python -m pip install -e '/tmp/game1-original[dev]'
          mkdir -p /tmp/forensics
          python -m pip freeze > /tmp/forensics/environment.txt
          python -c 'import numpy; numpy.show_runtime()' > /tmp/forensics/numerical_runtime.txt
      - name: Capture SLSQP trace and post-hoc Jacobian conditioning around events 120-136
        run: PYTHONPATH=/tmp/game1-original/src python scripts/probe_paper_section3_2_call2_forensics.py --out /tmp/forensics
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: section32-call2-forensics-${{ matrix.label }}
          path: /tmp/forensics/
          if-no-files-found: error
  compare:
    needs: probe
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: game1-economic-policy-interface
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.4.6
      - uses: actions/download-artifact@v4
        with:
          pattern: section32-call2-forensics-*
          path: /tmp/forensics
      - name: Compare shared-point Jacobians, singular values, gradient stability and event 131
        run: python scripts/compare_paper_section3_2_call2_forensics.py --root /tmp/forensics --out /tmp/assessment
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: section32-call2-forensic-assessment
          path: /tmp/assessment/
          if-no-files-found: warn
