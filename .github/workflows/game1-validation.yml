name: Game 1 reproducibility

on:
  push:
    branches:
      - docs/research-consolidation
    paths:
      - ".github/workflows/game1-validation.yml"
      - "src/interfirm_abm/**"
      - "experiments/validation_05.py"
      - "experiments/game1_mechanism_trajectories.py"
      - "experiments/game1_sensitivity.py"
      - "tests/**"
      - "pyproject.toml"
  workflow_dispatch:

jobs:
  validation-05:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install research package and tests
        run: python -m pip install -e ".[dev]"
      - name: Run automated tests
        run: python -m pytest -q
      - name: Run Game 1 matched experiment
        run: python -m experiments.validation_05 --export-dir results/validation_05
      - name: Validate exported data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          folder = Path("results/validation_05")
          paired = pd.read_csv(folder / "paired_observations.csv")
          metadata = json.loads((folder / "metadata.json").read_text())
          assert len(paired) == metadata["expected_paired_rows"] == 8000
          assert not paired.isna().any().any()
          assert sorted(paired["round"].unique().tolist()) == [5, 10, 20, 50]
          assert paired["seed"].nunique() == 100
          assert paired["firm_id"].nunique() == 20
          assert (paired["random"] > 0).all()
          print("Validation 05 export checks passed:", len(paired), "matched rows")
          PY
      - name: Export Game 1 learning trajectories
        run: python -m experiments.game1_mechanism_trajectories --export-dir results/game1_mechanism
      - name: Record exact source revision
        run: |
          printf '%s\n' "$GITHUB_SHA" > results/validation_05/source_commit.txt
          python -m pip freeze > results/validation_05/environment.txt
      - name: Upload private research artifacts
        uses: actions/upload-artifact@v4
        with:
          name: game1-validation-05-${{ github.sha }}
          path: |
            results/validation_05/
            results/game1_mechanism/
          if-no-files-found: error
          retention-days: 90

  sensitivity:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install research package
        run: python -m pip install -e ".[dev]"
      - name: Run matched sensitivity analysis
        run: python -m experiments.game1_sensitivity --seeds 100 --export-dir results/game1_sensitivity
      - name: Record source revision
        run: |
          printf '%s\n' "$GITHUB_SHA" > results/game1_sensitivity/source_commit.txt
          python -m pip freeze > results/game1_sensitivity/environment.txt
      - name: Upload private sensitivity artifact
        uses: actions/upload-artifact@v4
        with:
          name: game1-sensitivity-${{ github.sha }}
          path: results/game1_sensitivity/
          if-no-files-found: error
          retention-days: 90
