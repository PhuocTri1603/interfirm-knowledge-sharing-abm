name: Section 3.2 fast F011 numerical diagnosis
on:
  push:
    branches: [game1-economic-policy-interface]
    paths:
      - '.github/workflows/paper-section3-2-fast-diagnostic.yml'
      - 'scripts/trace_paper_section3_2_first_divergence.py'
      - 'scripts/compare_paper_section3_2_solver_traces.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: section32-fast-diagnostic
  cancel-in-progress: true
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        threads: ['1','2']
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: ${{ matrix.threads }}
      OMP_NUM_THREADS: ${{ matrix.threads }}
      MKL_NUM_THREADS: ${{ matrix.threads }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: game1-economic-policy-interface
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install immutable historical game
        run: |
          git worktree add --detach /tmp/game1-original c614b86d9192a57fb402b4772b3c3bb6bf80b79f
          python -m pip install -e '/tmp/game1-original[dev]'
          mkdir -p /tmp/original /tmp/trace
          python -m pip freeze > /tmp/trace/environment.txt
          python -c 'import numpy; numpy.show_runtime()' > /tmp/trace/numerical_runtime.txt
          env | grep -E '^(OPENBLAS|OMP|MKL)_' > /tmp/trace/thread_settings.txt
      - name: Download archived baseline
        run: gh run download 42463803820 -R "${{ github.repository }}" -n game1-full-sample-analysis -D /tmp/original
      - name: Targeted F011 optimizer trace
        run: PYTHONPATH=/tmp/game1-original/src python scripts/trace_paper_section3_2_first_divergence.py --archive /tmp/original --out /tmp/trace --profile F011 --sigma 0.5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: section32-fast-threads-${{ matrix.threads }}
          path: /tmp/trace/
          if-no-files-found: error
  compare:
    if: always()
    needs: trace
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: game1-economic-policy-interface
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pandas==2.3.3
      - uses: actions/download-artifact@v4
        with:
          pattern: section32-fast-threads-*
          path: /tmp/traces
      - name: Compare solver input and output hashes
        run: python scripts/compare_paper_section3_2_solver_traces.py --traces /tmp/traces --out /tmp/compare
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: section32-fast-thread-comparison
          path: /tmp/compare/
          if-no-files-found: warn
