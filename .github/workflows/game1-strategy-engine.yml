name: Game 1 256 strategy engine
on:
  push:
    branches:
      - game1-economic-policy-interface
  pull_request:
    paths:
      - 'src/interfirm_abm/task_strategy_engine.py'
      - 'tests/test_task_strategy_engine.py'
      - 'src/interfirm_abm/task_a6_market.py'
      - 'src/interfirm_abm/task_l34_economics.py'
      - 'tests/test_task_l34_economics.py'
      - 'tests/test_task_a6_market.py'
      - '.github/workflows/game1-strategy-engine.yml'
  workflow_dispatch:
jobs:
  strategy-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q tests/test_task_strategy_engine.py tests/test_task_a6_market.py tests/test_task_l34_economics.py
      - run: |
          python - <<'PY'
          from interfirm_abm.task_strategy_engine import strategy_roster
          r = strategy_roster()
          assert len(r) == len(set(x.strategy_id for x in r)) == 256
          print("256 distinct strategy identities verified")
          PY
