name: Section 3.2 independent-process solver comparison
on:
  workflow_dispatch:
  push:
    branches: [game1-economic-policy-interface]
    paths:
      - '.github/workflows/paper-section3-2-independent-traces.yml'
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        repeat: [1, 2, 3]
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: game1-economic-policy-interface
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Historical model checkout
        run: |
          git worktree add --detach /tmp/game1-original c614b86d9192a57fb402b4772b3c3bb6bf80b79f
          python -m pip install -e '/tmp/game1-original[dev]'
          mkdir -p /tmp/trace /tmp/original
          python -m pip freeze > /tmp/trace/environment.txt
          python -c 'import numpy; numpy.show_config()' > /tmp/trace/numpy_build.txt
      - name: Download original archive
        run: gh run download 42463803820 -R "${{ github.repository }}" -n game1-full-sample-analysis -D /tmp/original
      - name: Independent F011 replay with optimizer trace
        run: PYTHONPATH=/tmp/game1-original/src python scripts/trace_paper_section3_2_first_divergence.py --archive /tmp/original --out /tmp/trace --profile F011 --sigma 0.5
      - name: Preserve complete diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: section32-independent-F011-${{ matrix.repeat }}
          path: /tmp/trace/
          retention-days: 30
          if-no-files-found: warn
  compare:
    needs: trace
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v4
        with:
          ref: game1-economic-policy-interface
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pandas
      - uses: actions/download-artifact@v4
        with:
          pattern: section32-independent-F011-*
          path: /tmp/traces
      - name: Compare all optimizer inputs and outputs, first divergence only
        run: python scripts/compare_paper_section3_2_solver_traces.py --traces /tmp/traces --out /tmp/compare
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: section32-independent-solver-comparison
          path: /tmp/compare/
          if-no-files-found: warn
