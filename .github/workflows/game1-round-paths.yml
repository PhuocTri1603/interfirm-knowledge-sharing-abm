name: Game 1 round-level trajectory diagnosis
on:
  workflow_dispatch:
jobs:
  round-paths:
    strategy:
      fail-fast: false
      matrix:
        population_seed: [2026, 2027, 2028, 2029, 2030]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/game1-heterogeneous-firms
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[dev]"
      - name: Verify simulation tests
        run: python -m pytest -q
      - name: Diagnose paired round-level trajectories
        run: python -m experiments.diagnose_game1_round_paths --population-seed ${{ matrix.population_seed }} --learning-seeds 100 --output results/game1-round-paths-${{ matrix.population_seed }}.json
      - name: Record source commit
        run: git rev-parse HEAD > results/source-commit-${{ matrix.population_seed }}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: game1-round-paths-${{ matrix.population_seed }}-${{ github.run_id }}
          path: |
            results/game1-round-paths-${{ matrix.population_seed }}.json
            results/source-commit-${{ matrix.population_seed }}.txt
          retention-days: 90
