name: Game 1 mixed price-quantity market
on:
  pull_request:
    paths:
      - 'src/interfirm_abm/task_mixed_market.py'
      - 'tests/test_task_mixed_market.py'
      - '.github/workflows/game1-mixed-market.yml'
  workflow_dispatch:
jobs:
  mixed-market:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q tests/test_task_strategy_engine.py tests/test_task_mixed_market.py
