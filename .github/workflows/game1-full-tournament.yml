name: Game 1 full-sample tournament infrastructure
on:
  pull_request:
    paths:
      - 'src/interfirm_abm/task_full_tournament.py'
      - 'tests/test_task_full_tournament.py'
      - 'src/interfirm_abm/task_tournament_export.py'
      - 'tests/test_task_tournament_export.py'
      - '.github/workflows/game1-full-tournament.yml'
  workflow_dispatch:
jobs:
  full-tournament:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q tests/test_task_strategy_engine.py tests/test_task_mixed_market.py tests/test_task_full_tournament.py tests/test_task_tournament_export.py
