name: Game 1 full-sample tournament infrastructure
on:
  pull_request:
    paths:
      - 'src/interfirm_abm/task_full_tournament.py'
      - 'tests/test_task_full_tournament.py'
      - 'src/interfirm_abm/task_tournament_export.py'
      - 'tests/test_task_tournament_export.py'
      - 'src/interfirm_abm/task_tournament_dashboard.py'
      - 'tests/test_task_tournament_dashboard.py'
      - 'tests/test_task_tournament_integration.py'
      - '.github/workflows/game1-full-tournament.yml'
      - 'site/index.html'
  workflow_dispatch:
jobs:
  full-tournament:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q tests/test_task_strategy_engine.py tests/test_task_mixed_market.py tests/test_task_full_tournament.py tests/test_task_tournament_export.py tests/test_task_tournament_dashboard.py tests/test_task_tournament_integration.py
      - name: Build one-configuration diagnostic dashboard preview (not research results)
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "tests")
          from test_task_full_tournament import configurations, market_factory, policy_factory
          from interfirm_abm.task_full_tournament import TournamentSpecification, run_full_tournament
          from interfirm_abm.task_tournament_dashboard import write_tournament_dashboard
          result = run_full_tournament(
              configurations(1),
              TournamentSpecification(market_factory, policy_factory, rounds=200,
                                      expected_configurations=1),
          )
          write_tournament_dashboard(result, "preview/economic-results.json")
          from interfirm_abm.task_tournament_export import export_tournament
          export_tournament(result, "preview/tables")
          print("Wrote 1 configuration x 256 players x 200 rounds diagnostic JSON")
          PY
      - name: Validate diagnostic preview disclosure
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("preview/economic-results.json").read_text())
          assert data["players"] == 256 and data["rounds"] == 200
          assert len(data["configurations"]) == 1
          assert len(data["configurations"][0]["player_trajectory"]) == 51200
          assert "ILLUSTRATIVE" in data["warning"]
          from pathlib import Path
          manifest = json.loads(Path("preview/tables/manifest.json").read_text())
          assert manifest["player_round_observations"] == 51200
          assert manifest["research_validated"] is False
          print("Diagnostic preview validated; NOT scientific results")
          PY
      - name: Build static website preview bundle
        run: |
          mkdir -p preview-site
          cp site/index.html preview-site/index.html
          cp preview/economic-results.json preview-site/economic-results.json
          python - <<'PY'
          from pathlib import Path
          html = Path("preview-site/index.html").read_text(encoding="utf-8")
          assert 'fetch("./economic-results.json"' in html
          assert 'id="player-chart"' in html
          assert Path("preview-site/economic-results.json").is_file()
          print("Static preview website bundle is ready")
          PY
      - name: Upload diagnostic website preview (not published)
        uses: actions/upload-artifact@v4
        with:
          name: game1-256-player-website-preview
          path: preview-site/
          if-no-files-found: error
      - name: Upload diagnostic dashboard preview (not published)
        uses: actions/upload-artifact@v4
        with:
          name: game1-256-player-diagnostic-preview
          path: |
            preview/economic-results.json
            preview/tables/
          if-no-files-found: error
