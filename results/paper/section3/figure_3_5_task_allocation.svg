   <g id="text_2">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(137.47726 89.953856)">Original CSVs contain aggregate output and AI task counts,</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(114.554135 98.912106)">but no task activity, normalized task index, or task-level K/L allocation.</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(106.681635 107.870356)">A 20-task distribution would require verified observational instrumentation</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(132.572885 116.828606)">and baseline-matched reproduction of the original simulation.</text>
   </g>
   <g id="text_3">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #9a4c00" x="256.55976" y="155.711578" transform="rotate(-0 256.55976 155.711578)">Evidence gap — no task-level values are plotted</text>
