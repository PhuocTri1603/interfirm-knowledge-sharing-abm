    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle" x="256.55976" y="54.803183" transform="rotate(-0 256.55976 54.803183)">Task-level allocation: not identifiable from archived outputs</text>
