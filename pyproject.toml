[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "interfirm-knowledge-sharing-abm"
version = "0.1.0"
description = "Agent-based research on inter-firm knowledge sharing under technological heterogeneity"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary - research in development"}
authors = [
    {name = "Vo Phuoc Tri"}
]
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
    "matplotlib>=3.8,<4"
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
